<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concreción de Inglés, paso a paso</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FBF8F5; --bg2:#F3EEE9; --ink:#1F1D1B; --mute:#6E6862; --line:#E4DDD5;
  --coral:#F9A6A4; --coral-d:#C9524E; --coral-t:#FDE3E2; --coral-t2:#FEF2F1;
  --graph:#4B4744; --graph-t:#EEEBE7; --graph-t2:#F6F4F1;
  --ok:#2F7D4F; --ok-t:#E1F0E6; --warn:#9A6B00; --warn-t:#F6EBCB; --nc:#8A8580; --nc-t:#EEEBE7;
  --card:#FFFFFF; --shadow:0 18px 50px -20px rgba(60,30,25,.28);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171615; --bg2:#1F1D1B; --ink:#EFEAE4; --mute:#A59F98; --line:#34302C;
  --coral:#F9A6A4; --coral-d:#F6B9B7; --coral-t:#3B2826; --coral-t2:#2C2220;
  --graph:#CFC9C2; --graph-t:#2A2724; --graph-t2:#232120;
  --ok:#7CC493; --ok-t:#1F3327; --warn:#E2B94F; --warn-t:#3A3014; --nc:#9A948D; --nc-t:#2A2724;
  --card:#211F1D; --shadow:0 18px 50px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#171615; --bg2:#1F1D1B; --ink:#EFEAE4; --mute:#A59F98; --line:#34302C;
  --coral:#F9A6A4; --coral-d:#F6B9B7; --coral-t:#3B2826; --coral-t2:#2C2220;
  --graph:#CFC9C2; --graph-t:#2A2724; --graph-t2:#232120;
  --ok:#7CC493; --ok-t:#1F3327; --warn:#E2B94F; --warn-t:#3A3014; --nc:#9A948D; --nc-t:#2A2724;
  --card:#211F1D; --shadow:0 18px 50px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-inline:0;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral-d);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.02}
.disp{font-family:"Bricolage Grotesque",sans-serif}
/* --- barra --- */
#top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#top.show{transform:none}
#logo{display:flex;align-items:center;height:30px;flex:none} #logo img{height:30px;width:auto;display:block} #logo img.neg{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #logo img.pos{display:none} :root:not([data-theme="light"]) #logo img.neg{display:block} }
:root[data-theme="dark"] #logo img.pos{display:none} :root[data-theme="dark"] #logo img.neg{display:block}
.home-logo{height:clamp(46px,5.4vw,66px);width:auto;margin:0 auto 20px;display:block} .home-logo.neg{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .home-logo.pos{display:none} :root:not([data-theme="light"]) .home-logo.neg{display:block} }
:root[data-theme="dark"] .home-logo.pos{display:none} :root[data-theme="dark"] .home-logo.neg{display:block}
#back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
#back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.crumb{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap;max-width:min(46vw,420px)}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.crumb i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--graph)}
.crumb.c-eie i{background:var(--coral)} .crumb.c-ebo i{background:var(--coral-d)} .crumb.c-of i{background:var(--graph)} .crumb.c-cc i{background:var(--coral-d)}
.crumb:hover{border-color:var(--coral)}
.thread{width:22px;height:2px;background:var(--line);flex:none;position:relative;overflow:hidden}
.thread::after{content:"";position:absolute;inset:0;background:var(--coral);transform:scaleX(0);transform-origin:left;animation:thread .5s .1s forwards}
@keyframes thread{to{transform:none}}
#steps{display:flex;gap:6px;align-items:center;margin-left:auto}
#steps b{display:block;width:26px;height:4px;border-radius:2px;background:var(--line);transition:background .4s}
#steps b.on{background:var(--coral-d)}
#steps span{font-size:12px;color:var(--mute);margin-left:6px;white-space:nowrap}
/* --- escenario --- */
#stage{position:relative;min-height:100vh;min-height:100dvh}
.scene{position:relative;padding:96px clamp(18px,5vw,72px) 72px;min-height:100vh;min-height:100dvh;max-width:1380px;margin:0 auto}
.scene.leaving{position:absolute;inset:0;pointer-events:none}
.scene.home{display:grid;place-items:center;text-align:center;padding-top:34px}
.scene.home>div{display:flex;flex-direction:column;align-items:center;width:min(880px,100%)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--coral-d)}
.lead{font-size:clamp(16px,1.35vw,19px);color:var(--mute);max-width:54ch;margin:0 auto}
.home h1{font-size:clamp(36px,5.6vw,74px);font-weight:800;margin:10px 0 14px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(820px,100%);margin:26px auto 18px}
.sumi{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sumi b{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(26px,3.2vw,38px);font-weight:800;color:var(--coral-d);line-height:1}
.sumi span{font-weight:600;font-size:13.5px}
.sumi small{font-size:12px;color:var(--mute);line-height:1.3}
@media (max-width:640px){.sum{grid-template-columns:repeat(2,1fr)}}
.route{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0;margin:0 0 26px;width:min(900px,100%)}
.route li{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 9px;border-radius:12px;background:var(--bg2);font-size:12.8px;font-weight:500;text-align:left;line-height:1.25}
@media (max-width:760px){.route{grid-template-columns:repeat(2,1fr)}}
.route em{width:22px;height:22px;flex:none;border-radius:50%;background:var(--coral);color:#4A2A28;font-style:normal;font-weight:700;font-size:12px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif}
.stack{position:relative;width:min(560px,92vw);height:230px;margin:26px auto 26px}
.stack .lay{position:absolute;left:0;right:0;margin-inline:auto;width:100%;padding:14px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;font-size:13.5px;line-height:1.35;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;min-height:72px}
.stack .lay b{font-family:"Bricolage Grotesque",sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.lay.l1{top:0;background:var(--graph-t2);width:92%} .lay.l1 b{background:var(--graph);color:#fff}
.lay.l2{top:82px;background:var(--coral-t2);width:97%} .lay.l2 b{background:var(--coral-d);color:#fff}
.lay.l3{top:164px} .lay.l3 b{background:var(--coral);color:#fff}
.cta{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px;transition:transform .2s,background .2s}
.cta:hover{transform:translateY(-2px);background:var(--coral-d);color:#fff}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sub-cta{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--mute)}
/* cabeceras de paso */
.stephead{display:flex;flex-direction:column;gap:8px;margin-bottom:34px;max-width:70ch}
.stephead h2{font-size:clamp(30px,4.4vw,56px);font-weight:700}
.stephead p{margin:0;color:var(--mute);font-size:clamp(15px,1.3vw,18px)}
/* tarjetas grandes */
.choice{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:26px 28px;border-radius:20px;background:var(--card);border:1px solid var(--line);width:100%;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--coral)}
.card .k{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.card h3{font-size:clamp(24px,2.6vw,36px);font-weight:700}
.card p{margin:0;font-size:clamp(16px,1.25vw,18px);line-height:1.45}
.card .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--bg2);color:var(--mute)}
.pill.eie{background:var(--coral-t);color:var(--coral-d)} .pill.ebo{background:var(--coral);color:#4A2A28} .pill.of{background:var(--graph-t);color:var(--graph)}
.card .go{position:absolute;right:20px;bottom:20px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);transition:background .2s,transform .25s}
.card .go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.card:hover .go{background:var(--coral-d);color:#fff;transform:translateX(3px)}
.card.tramo-eie{background:linear-gradient(0deg,var(--coral-t2),var(--card))} .card.tramo-eie h3{color:var(--coral-d)}
.card.tramo-ebo{background:var(--coral);border-color:var(--coral);color:#3A1F1E} .card.tramo-ebo h3{color:#3A1F1E} .card.tramo-ebo .k,.card.tramo-ebo p{color:#4A2A28} .card.tramo-ebo .pill{background:rgba(255,255,255,.55);color:#7A2E2A} .card.tramo-ebo .go{background:rgba(255,255,255,.6);color:#7A2E2A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card.tramo-ebo{color:#2A1716} }
.card.of{border-left:6px solid var(--graph)}
.card.of .num{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(34px,4vw,52px);font-weight:800;color:var(--graph);line-height:1}
.card.of.acc{cursor:default;border-left-color:var(--coral);background:var(--coral-t2)}
.card.of.acc:hover{transform:none;box-shadow:none;border-color:var(--line);border-left-color:var(--coral)}
.card.of.acc .num{color:var(--coral-d)}
.pill.acc{background:var(--coral-t);color:var(--coral-d)}
.card.of.no{opacity:.62;cursor:default;border-left-color:var(--warn)} .card.of.no:hover{transform:none;box-shadow:none;border-color:var(--line);border-left-color:var(--warn)}
.card.of.no .why{font-size:14px;color:var(--warn);background:var(--warn-t);padding:8px 12px;border-radius:10px}
.card.cc{border-left:6px solid var(--coral-d)}
.card.cc .cod{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(40px,5vw,64px);font-weight:800;color:var(--coral-d);line-height:1}
.card.cc p{font-size:clamp(19px,1.8vw,26px);font-weight:500;line-height:1.35}
.grid-of{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
/* tarjeta fijada (origen) */
.pinned{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:20px 24px;border-radius:18px;background:var(--graph-t2);border:1px solid var(--line);margin-bottom:12px}
.pinned .num{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;color:var(--graph);line-height:1}
.pinned .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.pinned p{margin:4px 0 0;font-size:16px;line-height:1.45}
.pinned.cc{background:var(--coral-t2)} .pinned.cc .num{color:var(--coral-d)}
/* paso 3: hilo + hijos */
.branch{position:relative;padding-top:30px}
.branch svg.wire{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.branch svg.wire path{fill:none;stroke:var(--coral-d);stroke-width:2.5;stroke-linecap:round}
.branch .kids{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin-left:clamp(0px,6vw,80px)}
.note{margin-top:26px;padding:14px 18px;border-radius:14px;background:var(--bg2);color:var(--mute);font-size:15px;max-width:80ch}
/* paso 4: escalera */
.stairs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px;align-items:end;margin-top:8px}
.step{display:flex;flex-direction:column;gap:12px;padding:22px 22px 26px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-height:calc(240px + var(--i)*56px);position:relative}
.step::before{content:"";position:absolute;left:22px;right:22px;top:0;height:5px;border-radius:0 0 4px 4px;background:var(--coral)}
.step.ebo::before{background:var(--coral-d)}
.step .lv{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(28px,3vw,42px);font-weight:800;color:var(--coral-d);line-height:1}
.step .corr{font-size:13px;color:var(--mute);font-weight:600}
.step p{margin:4px 0 0;font-size:clamp(16px,1.35vw,19px);line-height:1.45}
.step .rank{margin-top:auto;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
@media (max-width:820px){.stairs{grid-template-columns:1fr}.step{min-height:0}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:34px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px}
.rule b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;padding:4px 10px;border-radius:8px;line-height:1.1}
.rule.C b{background:var(--ok-t);color:var(--ok)} .rule.EP b{background:var(--warn-t);color:var(--warn)} .rule.NC b{background:var(--nc-t);color:var(--nc)}
.rule span{display:block;font-weight:600;margin-bottom:2px}
.trace{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:32px 0 0;font-size:12.5px;color:var(--mute)}
.trace b{padding:4px 9px;border-radius:7px;background:var(--bg2);color:var(--ink);font-weight:600;font-size:12.5px}
.trace i{font-style:normal}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;line-height:1.2;white-space:nowrap;transition:border-color .2s,transform .2s}
.btn svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.card .go svg,.cta svg{fill:none;stroke:currentColor}
@media (max-width:560px){.btn{white-space:normal}}
.btn:hover{border-color:var(--coral-d);transform:translateY(-2px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)} .btn.primary:hover{background:var(--coral-d);border-color:var(--coral-d);color:#fff}
/* matriz */
.mwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table.mx{border-collapse:separate;border-spacing:0;min-width:900px;width:100%;font-size:14.5px}
.mx th,.mx td{padding:14px 16px;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.mx th{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;text-align:left;background:var(--bg2);position:sticky;top:0;z-index:2}
.mx th.lv{color:var(--coral-d);font-size:18px}
.mx td.first,.mx th.first{position:sticky;left:0;background:var(--card);z-index:3;min-width:260px;max-width:320px;box-shadow:4px 0 0 -3px var(--line)}
.mx th.first{z-index:4;background:var(--bg2)}
.mx td.first b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;color:var(--coral-d);display:block;line-height:1}
.mx td.first small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.mx td.first span{display:block;margin-top:6px;font-weight:500}
.mx td.cell{padding:0}
.mx td.cell button{display:block;width:100%;height:100%;padding:14px 16px;line-height:1.4;border-radius:0;transition:background .2s}
.mx td.cell button:hover{background:var(--coral-t2)}
.mx td.cell button:focus-visible{outline-offset:-3px;border-radius:0}
.mx tr:last-child td{border-bottom:0}
/* animaciones de entrada */
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

: "EIE 2", "txt": "Saluda y se despide en inglés por su vía al empezar y al terminar la sesión, con una señal visual o verbal del adulto."}, {"nivel": "EIE 3", "txt": "Saluda, se despide y sigue el orden de la rutina (saludo, canción, actividad, despedida) sin recordatorio."}]}, {"cod": "E2", "txt": "Se implica en canciones y juegos en inglés reproduciendo gestos, movimientos o sonidos", "ind": [{"nivel": "Acceso", "txt": "Atiende a la canción o al juego (mira, se mueve con el ritmo, se calma) durante al menos parte de la actividad."}, {"nivel": "EIE 1", "txt": "Reproduce uno o dos gestos o movimientos de una canción conocida siguiendo al adulto."}, {"nivel": "EIE 2", "txt": "Reproduce la secuencia de gestos de dos o tres canciones conocidas siguiendo al grupo."}, {"nivel": "EIE 3", "txt": "Sigue el modelo en canciones y juegos nuevos y, en los conocidos, hace el gesto antes de que llegue la palabra."}]}], "no": null}, {"num": "2.3", "txt": "Mostrar interés por conocer y comprender mensajes muy sencillos en lengua extranjera relacionados con rutinas y situaciones cotidianas.", "comp": 2, "centros": [{"cod": "E3", "txt": "Responde a instrucciones sencillas del aula dadas en inglés, con una acción, un gesto o la mirada", "ind": [{"nivel": "Acceso", "txt": "Responde a una instrucción de rutina (come here, sit down, stop) cuando va acompañada de gesto y de ayuda física."}, {"nivel": "EIE 1", "txt": "Responde a instrucciones de rutina en inglés acompañadas de gesto."}, {"nivel": "EIE 2", "txt": "Responde a instrucciones sencillas en inglés sin gesto, dentro de la rutina conocida (give me, open, put, wait)."}, {"nivel": "EIE 3", "txt": "Responde a instrucciones de dos pasos o con un elemento nuevo (give me the red one, put it on the table)."}]}, {"cod": "E4", "txt": "Identifica el vocabulario trabajado cuando se nombra en inglés (señala, mira, elige entre opciones, lo busca en el comunicador)", "ind": [{"nivel": "Acceso", "txt": "Dirige la mirada o la mano hacia el objeto o la imagen nombrados en inglés, entre dos opciones, con apoyo del adulto."}, {"nivel": "EIE 1", "txt": "Señala o elige el objeto o la imagen nombrados en inglés entre dos o tres opciones."}, {"nivel": "EIE 2", "txt": "Señala o elige entre varias opciones el vocabulario de los campos trabajados en su plan curricular."}, {"nivel": "EIE 3", "txt": "Identifica el vocabulario trabajado en un contexto distinto del de la sesión (en un cuento, en el patio, en una imagen nueva)."}]}], "no": null}, {"num": "3.8", "txt": "Adquirir y utilizar, de manera gradual y acorde al nivel madurativo, vocabulario y expresiones sencillas en lengua extranjera relacionadas con rutinas y situaciones habituales de comunicación.", "comp": 3, "centros": [{"cod": "E5", "txt": "Nombra por su vía el vocabulario trabajado en inglés", "ind": [{"nivel": "Acceso", "txt": "Vocaliza, signa o pulsa (aunque sea una aproximación) ante un objeto o imagen que le motiva, cuando el adulto lo acaba de nombrar en inglés."}, {"nivel": "EIE 1", "txt": "Nombra por su vía entre tres y cinco palabras en inglés de las trabajadas, con modelo inmediato del adulto."}, {"nivel": "EIE 2", "txt": "Nombra por su vía el vocabulario de los campos trabajados cuando se le pregunta (What's this?)."}, {"nivel": "EIE 3", "txt": "Nombra el vocabulario trabajado sin que se le pregunte, para pedir, comentar o elegir, y combina dos palabras (red car, big dog)."}]}, {"cod": "E6", "txt": "Usa expresiones de rutina en inglés en el momento que corresponde (hello, bye, thank you, please, more, help)", "ind": [{"nivel": "Acceso", "txt": "Responde con gesto o mirada a hello, bye y more o help dentro de la rutina."}, {"nivel": "EIE 1", "txt": "Usa hello y bye por su vía en su momento, con recordatorio del adulto."}, {"nivel": "EIE 2", "txt": "Usa hello, bye, thank you, please, more y help por su vía en su momento, sin recordatorio."}, {"nivel": "EIE 3", "txt": "Usa las expresiones de rutina y otras trabajadas (I'm fine, my turn, I want, can I) ajustadas a la situación."}]}], "no": null}, {"num": "5.2", "txt": "Participar en interacciones comunicativas en lengua extranjera iniciándose en el uso de normas socialmente establecidas para comenzar, mantener y terminar una conversación relacionadas con rutinas y situaciones cotidianas.", "comp": 5, "centros": [{"cod": "E7", "txt": "Responde por su vía a un saludo o una pregunta dirigida en inglés, esperando su turno", "ind": [{"nivel": "Acceso", "txt": "Responde a su nombre y a un saludo dirigido en inglés con la mirada, un gesto o un sonido."}, {"nivel": "EIE 1", "txt": "Responde por su vía a una pregunta cerrada dirigida (Do you like it? Is it a cat?) con sí o no, con apoyo visual."}, {"nivel": "EIE 2", "txt": "Responde por su vía a preguntas sencillas dirigidas (What's your name? How are you? What colour?), esperando su turno."}, {"nivel": "EIE 3", "txt": "Mantiene un intercambio de dos o tres turnos en inglés (pregunta, respuesta, pregunta) con el adulto o con un compañero."}]}, {"cod": "E8", "txt": "Inicia un intercambio en inglés (saluda, pide, elige) sin que se le pida", "ind": [{"nivel": "Acceso", "txt": "Reclama continuar una actividad que le gusta (more, again) con gesto, mirada o comunicador."}, {"nivel": "EIE 1", "txt": "Pide por su vía un objeto o una actividad en inglés cuando se le ofrece una elección (apple or banana?)."}, {"nivel": "EIE 2", "txt": "Inicia un saludo o una petición en inglés sin que se le pida, con adultos conocidos."}, {"nivel": "EIE 3", "txt": "Inicia intercambios en inglés con adultos y compañeros (saluda, pide, ofrece, comenta), en la sesión y fuera de ella."}]}], "no": null}, {"num": "5.4", "txt": "Mostrar una actitud positiva durante la aproximación a textos literarios en lengua extranjera tales como cuentos, pequeños poemas, leyendas…", "comp": 5, "centros": [{"cod": "E9", "txt": "Atiende a un cuento o canción-cuento en inglés hasta el final, con apoyo visual", "ind": [{"nivel": "Acceso", "txt": "Permanece y atiende a un cuento o canción-cuento en inglés muy breve, con apoyo visual y sensorial (objetos, texturas, sonidos)."}, {"nivel": "EIE 1", "txt": "Atiende a un cuento breve en inglés con apoyo visual hasta el final, con el adulto a su lado."}, {"nivel": "EIE 2", "txt": "Atiende a un cuento en inglés conocido y hace algún gesto o sonido en los momentos que se repiten."}, {"nivel": "EIE 3", "txt": "Atiende a cuentos nuevos en inglés, participa en las repeticiones (sonidos, frases, gestos) y anticipa lo que va a pasar."}]}, {"cod": "E10", "txt": "Reconoce personajes o elementos de un cuento o canción en inglés (los señala, los nombra, anticipa lo que viene)", "ind": [{"nivel": "Acceso", "txt": "Reacciona (mira, sonríe, se mueve) cuando aparece un personaje o elemento conocido en el cuento o la canción."}, {"nivel": "EIE 1", "txt": "Señala o elige un personaje o elemento del cuento cuando se le nombra en inglés."}, {"nivel": "EIE 2", "txt": "Nombra por su vía personajes o elementos del cuento y dice si le gustan (I like, I don't like)."}, {"nivel": "EIE 3", "txt": "Cuenta por su vía qué pasa en el cuento (quién, qué hace) con apoyo de las imágenes, y elige el que prefiere."}]}], "no": null}], "extra": {"primer_ciclo": [{"num": "1.5", "txt": "Mostrar interés y curiosidad hacia las diferentes lenguas."}, {"num": "5.1", "txt": "Mostrar respeto e interés por la variedad lingüística y cultural del aula."}], "nota": "En el nivel Acceso el referente oficial es el primer ciclo de Infantil, donde no existe el bloque J: la norma solo pide interés y curiosidad hacia las lenguas (1.5) y respeto por la variedad lingüística del aula (5.1). Por eso sus indicadores describen contacto y respuesta, no aprendizaje de vocabulario."}}, {"key": "ebo", "nombre": "Tramo EBO", "etapa": "Educación Básica Obligatoria", "decreto": "Decreto 61/2022", "dec_sub": "Currículo de Educación Primaria de la Comunidad de Madrid. Área Lengua Extranjera: Inglés, criterios del primer ciclo.", "comps": ["Comprender el sentido general e información específica y predecible de textos breves y sencillos, expresados de forma clara y en la lengua estándar, haciendo uso de diversas estrategias y recurriendo, cuando sea necesario, al uso de distintos tipos de apoyo, para desarrollar el repertorio del lenguaje y para responder a necesidades comunicativas cotidianas.", "Producir textos sencillos de manera comprensible y estructurada, mediante el empleo de estrategias como la planificación o la compensación, para expresar mensajes breves relacionados con necesidades inmediatas y responder a propósitos comunicativos cotidianos.", "Interactuar con otras personas usando expresiones cotidianas, recurriendo a estrategias de colaboración y empleando recursos analógicos y digitales, para responder a necesidades inmediatas de su interés en intercambios comunicativos respetuosos con las normas de cortesía.", "Participar en situaciones predecibles, usando estrategias y conocimientos para procesar y transmitir información básica y sencilla, con el fin de facilitar la comunicación.", "Reconocer y usar los repertorios lingüísticos personales entre distintas lenguas, reflexionando sobre su funcionamiento e identificando las estrategias y conocimientos propios, para mejorar la respuesta a necesidades comunicativas concretas en situaciones conocidas.", "Apreciar y respetar la diversidad de otros contextos a partir de la lengua extranjera, identificando y valorando las diferencias y semejanzas entre lenguas y culturas, para aprender a gestionar situaciones entre diferentes culturas."], "niveles": [{"nom": "EBO 1", "corr": "Entrada al primer ciclo", "sub": "Primer paso del primer ciclo de Primaria"}, {"nom": "EBO 2", "corr": "Mitad del primer ciclo", "sub": "Segundo paso"}, {"nom": "EBO 3", "corr": "Cierre del primer ciclo", "sub": "Techo del ciclo; la adaptación puede seleccionar criterios del segundo ciclo"}], "criterios": [{"num": "1.1", "txt": "Reconocer e interpretar palabras y expresiones habituales en textos orales, escritos y multimodales breves y sencillos sobre temas frecuentes y cotidianos de relevancia personal y próximos a su experiencia, expresados de forma comprensible, clara, sencilla y directa y en lengua estándar.", "comp": 1, "centros": [{"cod": "B1", "txt": "Comprende palabras y expresiones conocidas en mensajes orales y textos breves con apoyo visual, y lo demuestra (actúa, señala, elige, responde)", "ind": [{"nivel": "EBO 1", "txt": "Responde a instrucciones y preguntas de aula en inglés e identifica el vocabulario de los campos trabajados en textos orales muy breves (una canción, la descripción de una imagen), con apoyo visual."}, {"nivel": "EBO 2", "txt": "Comprende frases sencillas con las estructuras trabajadas (there is, I have got, I like, he is big) sobre imágenes o situaciones conocidas, y las relaciona con la imagen correcta; sigue una historia breve con apoyo visual."}, {"nivel": "EBO 3", "txt": "Comprende el sentido general de textos orales y escritos breves (una descripción, una historia, un diálogo) sobre temas trabajados, y localiza en ellos información concreta (quién, dónde, cuántos, de qué color)."}]}], "no": null}, {"num": "1.2", "txt": "Seleccionar y aplicar de forma guiada estrategias elementales en situaciones comunicativas cotidianas y de relevancia para el alumnado con el fin de captar la idea global e identificar elementos específicos con ayuda de elementos de la lengua y del contexto y el cotexto.", "comp": 1, "centros": [{"cod": "B2", "txt": "Usa estrategias para entender: mira la imagen, el gesto y el contexto, y pide repetición o ayuda", "ind": [{"nivel": "EBO 1", "txt": "Se apoya en la imagen y en el gesto del adulto para entender, y pide ayuda o repetición por su vía (again, help)."}, {"nivel": "EBO 2", "txt": "Usa el contexto y las palabras que conoce para deducir una palabra nueva dentro de una frase conocida, y pide aclaración en inglés (What? Again, please)."}, {"nivel": "EBO 3", "txt": "Antes de responder, localiza las palabras clave del mensaje o del texto (las señala o subraya) y las comprueba con la imagen o el contexto; distingue cuándo no ha entendido y lo dice."}]}], "no": null}, {"num": "2.1", "txt": "Expresar oralmente frases cortas y sencillas con información básica sobre asuntos cotidianos y de relevancia para el alumnado, utilizando de forma guiada recursos verbales y no verbales, recurriendo a modelos y estructuras previamente presentados y prestando atención al ritmo, la acentuación y la entonación en lengua inglesa.", "comp": 2, "centros": [{"cod": "B3", "txt": "Expresa por su vía mensajes breves en inglés (frases de dos o tres elementos) a partir de modelos", "ind": [{"nivel": "EBO 1", "txt": "Produce por su vía palabras y frases fórmula (I'm fine, it's a cat, I like apples) con un modelo inmediato."}, {"nivel": "EBO 2", "txt": "Produce frases de dos o tres elementos con las estructuras trabajadas (I have got a dog, there is a ball, he is big, I can jump) con apoyo visual y sin modelo inmediato."}, {"nivel": "EBO 3", "txt": "Produce mensajes de dos o tres frases enlazadas (and) sobre sí mismo, su familia o una imagen, con las estructuras del ciclo, y quien le escucha los entiende."}]}], "no": null}, {"num": "2.2", "txt": "Escribir palabras, expresiones conocidas y frases a partir de modelos y con una finalidad específica, a través de herramientas analógicas y digitales, usando léxico y estructuras elementales de la lengua inglesa sobre asuntos cotidianos y de relevancia personal para el alumnado.", "comp": 2, "centros": [{"cod": "B4", "txt": "Escribe o compone palabras y frases conocidas en inglés a partir de modelo (a mano, con letras móviles, teclado o pictogramas)", "ind": [{"nivel": "EBO 1", "txt": "Reproduce palabras conocidas a partir de modelo (copia, letras móviles, teclado, pictograma con etiqueta) y las asocia a su imagen."}, {"nivel": "EBO 2", "txt": "Escribe palabras conocidas sin modelo y completa frases con huecos (I like ___, it is ___) con banco de palabras o tarjetas."}, {"nivel": "EBO 3", "txt": "Escribe frases sencillas completas a partir de modelo y con una finalidad (una etiqueta, una felicitación, una lista, una descripción de tres frases)."}]}], "no": null}, {"num": "2.3", "txt": "Seleccionar y aplicar de forma guiada, estrategias básicas para producir mensajes breves y sencillos en inglés, adecuados a las intenciones comunicativas usando, con ayuda, recursos y apoyos físicos o digitales en función de las necesidades de cada momento.", "comp": 2, "centros": [{"cod": "B5", "txt": "Usa apoyos para producir (tarjetas, banco de palabras, comunicador, modelo escrito, gesto) cuando le falta la palabra", "ind": [{"nivel": "EBO 1", "txt": "Cuando no tiene la palabra, señala, hace el gesto o usa la tarjeta o el comunicador para hacerse entender."}, {"nivel": "EBO 2", "txt": "Elige entre sus apoyos (tarjeta, banco de palabras, comunicador, modelo escrito) el que necesita para completar el mensaje, con indicación del adulto."}, {"nivel": "EBO 3", "txt": "Usa por sí mismo los apoyos disponibles para preparar y corregir su mensaje (mira el modelo, consulta el banco de palabras, pregunta How do you say...?)."}]}], "no": null}, {"num": "3.1", "txt": "Participar, de forma guiada, en situaciones interactivas elementales sobre temas cotidianos, preparadas previamente, a través de diversos soportes, apoyándose en recursos tales como la repetición, el ritmo pausado o el lenguaje no verbal, y mostrando empatía.", "comp": 3, "centros": [{"cod": "B6", "txt": "Participa en intercambios preparados (juego de preguntas, role-play, presentación) manteniendo turnos", "ind": [{"nivel": "EBO 1", "txt": "Participa en un intercambio preparado con el adulto (What's this? It's a...; Do you like...? Yes / No) con apoyo visual y turnos marcados."}, {"nivel": "EBO 2", "txt": "Participa en un juego o role-play preparado con un compañero (tienda, restaurante, Guess who) manteniendo dos o tres turnos con apoyo de tarjetas."}, {"nivel": "EBO 3", "txt": "Mantiene un intercambio preparado de cuatro o más turnos con compañeros, respeta los turnos y usa recursos no verbales para arreglar los fallos."}]}], "no": null}, {"num": "3.2", "txt": "Seleccionar y utilizar, de forma guiada y en entornos próximos, estrategias elementales para saludar, despedirse y presentarse; expresar mensajes sencillos y breves; y formular y contestar preguntas básicas para la comunicación en lengua inglesa.", "comp": 3, "centros": [{"cod": "B7", "txt": "Saluda, se despide, se presenta, y formula y contesta preguntas básicas en inglés", "ind": [{"nivel": "EBO 1", "txt": "Saluda, se despide, dice su nombre y responde por su vía a How are you? y How old are you?"}, {"nivel": "EBO 2", "txt": "Se presenta con dos o tres datos (nombre, edad, gustos) y responde a preguntas con What, Where, How many y Who sobre temas trabajados."}, {"nivel": "EBO 3", "txt": "Formula y contesta preguntas básicas (What's your name? Where is...? How many...? Do you like...? Can you...?) para obtener información de otra persona."}]}], "no": null}, {"num": "4.1", "txt": "Interpretar y explicar, de forma guiada, información básica de conceptos, comunicaciones y textos breves y sencillos en situaciones en las que atender a la diversidad, mostrando empatía e interés por los interlocutores e interlocutoras y por los problemas de entendimiento en su entorno inmediato, apoyándose en diversos recursos y soportes.", "comp": 4, "centros": [{"cod": "B8", "txt": "Transmite a otros información sencilla (el tiempo, el día, lo que hay en una imagen, un mensaje recibido) con apoyos", "ind": [{"nivel": "EBO 1", "txt": "Transmite a la clase un dato de la rutina (el tiempo que hace, el día, cuántos hay) con apoyo visual (calendario, tarjetas del tiempo)."}, {"nivel": "EBO 2", "txt": "Explica en inglés a un compañero o al adulto, con apoyo, lo que ve en una imagen o lo que ha pasado en el juego."}, {"nivel": "EBO 3", "txt": "Transmite a otra persona un mensaje sencillo que ha recibido (del adulto, de un texto, de un compañero al que no se entiende), en inglés o en español según quien lo necesite."}]}], "no": null}, {"num": "5.1", "txt": "Comparar y contrastar similitudes y diferencias evidentes entre distintas lenguas reflexionando, de forma guiada, sobre aspectos elementales de su funcionamiento.", "comp": 5, "centros": [{"cod": "B9", "txt": "Compara el inglés con el español: reconoce palabras parecidas y dice cómo se dice algo en la otra lengua", "ind": [{"nivel": "EBO 1", "txt": "Reconoce palabras parecidas en inglés y en español (animal, elephant, chocolate, doctor) cuando se le presentan juntas."}, {"nivel": "EBO 2", "txt": "Dice cómo se dice en español una palabra trabajada en inglés, y al revés, y detecta palabras transparentes en una lista o un texto."}, {"nivel": "EBO 3", "txt": "Señala una diferencia entre las dos lenguas dentro de lo trabajado (el adjetivo antes del nombre, el plural, la s de he y she) y la aplica al producir."}]}], "no": null}, {"num": "5.2", "txt": "Identificar y aplicar, de forma guiada, conocimientos y estrategias de mejora de su capacidad de comunicar y de aprender la lengua extranjera, con apoyo de otros participantes y de soportes analógicos y digitales.", "comp": 5, "centros": [{"cod": "B10", "txt": "Usa estrategias para aprender: repite, imita, usa su diccionario visual, practica con tarjetas o juegos", "ind": [{"nivel": "EBO 1", "txt": "Repite e imita el modelo y usa su diccionario visual o su carpeta de tarjetas para recordar vocabulario, con indicación del adulto."}, {"nivel": "EBO 2", "txt": "Usa por sí mismo un recurso para recordar (diccionario visual, canción, gesto asociado) y practica en juegos de memoria o de emparejar."}, {"nivel": "EBO 3", "txt": "Elige cómo practicar lo que le cuesta (repetir, canción, tarjetas, juego digital) y comprueba con el adulto si lo ha conseguido."}]}], "no": null}, {"num": "5.3", "txt": "Identificar y explicar, de manera guiada, avances y dificultades elementales en el proceso de aprendizaje de la lengua extranjera.", "comp": 5, "centros": [], "no": "Pide que el alumno explique qué se le da bien y qué le cuesta del inglés (autoevaluación, Portfolio Europeo de las Lenguas). No hay conducta observable en nuestro alumnado; lo observable ya está recogido en el 5.2."}, {"num": "6.1", "txt": "Mostrar interés por la comunicación entre diferentes culturas, identificando y analizando, de forma guiada, las discriminaciones y los prejuicios más comunes, en situaciones cotidianas y habituales.", "comp": 6, "centros": [], "no": "Pide identificar y analizar discriminaciones y prejuicios entre culturas. No hay conducta observable en nuestras aulas; lo evaluable (respeto y curiosidad ante lo distinto) ya está en el 6.2."}, {"num": "6.2", "txt": "Reconocer y apreciar la diversidad de otros contextos relacionados con la lengua extranjera, mostrando interés por conocer los elementos fundamentales de la lengua y su cultura.", "comp": 6, "centros": [{"cod": "B11", "txt": "Reconoce elementos de la cultura de países de habla inglesa (fiestas, comidas, canciones, costumbres) y participa en ellos", "ind": [{"nivel": "EBO 1", "txt": "Participa en las celebraciones del calendario inglés trabajadas en el aula (Halloween, Christmas, Easter) y reconoce sus elementos cuando se nombran en inglés."}, {"nivel": "EBO 2", "txt": "Nombra elementos de la vida cotidiana en países de habla inglesa (comidas, fiestas, uniformes, canciones) y los distingue de los propios."}, {"nivel": "EBO 3", "txt": "Explica por su vía una costumbre de un país de habla inglesa trabajada y la compara con la suya."}]}], "no": null}], "extra": {"nota": "De los trece criterios del primer ciclo se seleccionan once. Los dos que quedan fuera se dicen y se explican, en lugar de dejar dos filas vacías en cada informe."}}], "reglas": [{"k": "C", "t": "Conseguido", "d": "La conducta del indicador aparece en cuatro sesiones distintas del trimestre, no necesariamente seguidas, con el apoyo previsto en su nivel."}, {"k": "EP", "t": "En proceso", "d": "Aparece entre una y tres sesiones, o solo con más apoyo del previsto."}, {"k": "NC", "t": "No conseguido", "d": "No ha aparecido en el trimestre."}]}</script>
<script>

  function sceneHome(){

  function sceneTramo(){
    return '<section class="scene"><div class="stephead in"><div class="eyebrow">Paso 1 de 4</div><h2>¿Qué tramo?</h2><p>La escalera tiene dos tramos. Cada uno sale de un decreto distinto de la Comunidad de Madrid.</p></div>'+
      '<div class="choice">'+D.tramos.map(function(t,i){ var n=t.criterios.filter(function(c){return !c.no;}).length, nc=t.criterios.reduce(function(a,c){return a+c.centros.length;},0);
        return '<button type="button" class="card tramo-'+t.key+' in" style="--d:'+(i+2)+'" data-go="of" data-tramo="'+t.key+'">'+
          '<div class="k">'+esc(t.etapa)+'</div><h3>'+esc(t.nombre)+'</h3><p>'+esc(t.dec_sub)+'</p>'+
          '<div class="meta"><span class="pill">'+esc(t.decreto)+'</span><span class="pill">'+n+' criterios oficiales</span><span class="pill">'+nc+' criterios del centro</span><span class="pill">'+t.niveles.length+' niveles: '+t.niveles.map(function(n){return n.nom;}).join(', ')+'</span></div>'+
          '<span class="go">'+ARROW+'</span></button>'; }).join('')+
      '</div></section>';
  }
  function sceneOf(){
    var t=tramo();
    return '<section class="scene"><div class="stephead in"><div class="eyebrow">Paso 2 de 4 · '+esc(t.decreto)+'</div><h2>El criterio oficial</h2><p>'+esc(t.dec_sub)+' Este texto es literal y no se toca: es lo que permite comprobar que evaluamos lo que pide la norma. '+esc(t.extra.nota)+'</p></div>'+
      '<div class="grid-of">'+t.criterios.map(function(c,i){
        var no = !!c.no;
        return '<'+(no?'div':'button type="button"')+' class="card of'+(no?' no':'')+' in" style="--d:'+(i+2)+'" '+(no?'':'data-go="cc" data-of="'+c.num+'"')+'>'+
          '<div class="num">'+esc(c.num)+'</div><p>'+esc(c.txt)+'</p>'+
          (no?'<div class="why"><b>No seleccionado.</b> '+esc(c.no)+'</div>':'')+
          '<div class="meta"><span class="pill of">Competencia '+c.comp+'</span>'+(no?'':'<span class="pill '+t.key+'">'+c.centros.length+(c.centros.length>1?' criterios':' criterio')+' del centro</span>')+'</div>'+
          (no?'':'<span class="go">'+ARROW+'</span>')+'</'+(no?'div':'button')+'>'; }).join('')+
      (t.extra.primer_ciclo? t.extra.primer_ciclo.map(function(c,i){ return '<div class="card of acc in" style="--d:'+(t.criterios.length+i+2)+'"><div class="num">'+esc(c.num)+'</div><p>'+esc(c.txt)+'</p><div class="meta"><span class="pill acc">Primer ciclo · referente del nivel Acceso</span></div></div>'; }).join(''):'')+
      '</div>'+(t.extra.primer_ciclo?'<div class="note in" style="--d:'+(t.criterios.length+4)+'"><b>Los dos últimos no llevan flecha.</b> En el primer ciclo de Infantil no existe el bloque J, así que no hay criterios de lengua extranjera como tales: solo estos dos, que hablan de interés y respeto hacia las lenguas, más la disposición adicional primera del Decreto, que permite experiencias de primer contacto. Son el referente del nivel Acceso (artículo 19.4 de la Orden), y por eso sus indicadores describen estar, atender y responder, no aprender vocabulario. El alumnado de Acceso se evalúa con los mismos diez criterios del centro, en su peldaño más bajo.</div>':'')+'</section>';
  }
  function sceneCc(){
    var t=tramo(), o=ofObj();
    return '<section class="scene"><div class="stephead in"><div class="eyebrow">Paso 3 de 4 · '+esc(t.nombre)+'</div><h2>El criterio del centro</h2><p>La traducción del criterio oficial a una conducta que se puede ver en el aula, por cualquier vía: oral, signo, comunicador, gesto o mirada. Es el mismo para todos los niveles del tramo y es el que aparece en el informe.</p></div>'+
      '<div class="pinned in" id="pin"><div class="num">'+esc(o.num)+'</div><div><div class="k">Criterio oficial · '+esc(t.decreto)+' · competencia '+o.comp+'</div><p>'+esc(o.txt)+'</p></div></div>'+
      '<div class="branch"><svg class="wire" aria-hidden="true"></svg><div class="kids">'+o.centros.map(function(c,i){
        return '<button type="button" class="card cc in" style="--d:'+(i*3+4)+'" data-go="ind" data-cc="'+c.cod+'"><div class="cod">'+esc(c.cod)+'</div><p>'+esc(c.txt)+'</p><div class="meta"><span class="pill '+t.key+'">'+c.ind.length+' indicadores, uno por nivel</span></div><span class="go">'+ARROW+'</span></button>'; }).join('')+
      '</div></div>'+
      (o.centros.length>1?'<div class="note in" style="--d:10">Dos por criterio oficial: uno de comprender y uno de expresar, para que un alumno pueda tener C en uno y EP en el otro.</div>':'')+'</section>';
  }
  function sceneInd(){
    var t=tramo(), o=ofObj(), c=ccObj();
    return '<section class="scene"><div class="stephead in"><div class="eyebrow">Paso 4 de 4 · '+esc(c.cod)+'</div><h2>Cómo se ve en cada nivel</h2><p>El mismo criterio, una exigencia por nivel. Un alumno está en un solo nivel todo el curso y esta es la frase que se marca C, EP o NC en su informe.</p></div>'+
      '<div class="pinned cc in" id="pin"><div class="num">'+esc(c.cod)+'</div><div><div class="k">Criterio del centro · sale del criterio oficial '+esc(o.num)+'</div><p>'+esc(c.txt)+'</p></div></div>'+
      '<div class="stairs" style="--n:'+c.ind.length+'">'+c.ind.map(function(x,i){ var nv=t.niveles[i];
        return '<div class="step '+t.key+' in" style="--i:'+i+';--d:'+(i*3+3)+'"><div class="lv">'+esc(x.nivel)+'</div><div class="corr">'+esc(nv.corr)+'</div><p>'+esc(x.txt)+'</p><div class="rank" style="--n:'+c.ind.length+'"><span>Peldaño '+(i+1)+'</span><u></u></div></div>'; }).join('')+
      '</div>'+
      '<div class="rules in" style="--d:14">'+D.reglas.map(function(r){return '<div class="rule '+r.k+'"><b>'+r.k+'</b><div><span>'+esc(r.t)+'</span>'+esc(r.d)+'</div></div>';}).join('')+'</div>'+
      '<div class="trace in" style="--d:15"><b>'+esc(t.decreto)+'</b><i>›</i><b>Criterio oficial '+esc(o.num)+'</b><i>›</i><b>'+esc(c.cod)+'</b><i>›</i><b>'+c.ind.length+' indicadores</b><i>›</i><b>Informe: C / EP / NC</b></div>'+
      '<div class="actions in" style="--d:16">'+
        (o.centros.length>1?'<button type="button" class="btn" data-go="cc">Otro criterio del centro del '+esc(o.num)+'</button>':'')+
        '<button type="button" class="btn" data-go="of">Otro criterio oficial</button>'+
        '<button type="button" class="btn primary" data-go="matriz">Ver el tramo completo '+ARROW+'</button>'+
      '</div></section>';
  }
  function sceneMatriz(){
    var t=tramo();
    var rows = []; t.criterios.forEach(function(o){ o.centros.forEach(function(c){ rows.push({o:o,c:c}); }); });
    return '<section class="scene"><div class="stephead in"><div class="eyebrow">'+esc(t.nombre)+' de un vistazo</div><h2>Todos los criterios del centro y sus indicadores</h2><p>Filas: los '+rows.length+' criterios del centro con el criterio oficial del que salen. Columnas: los niveles. Cada celda es lo que se evalúa a un alumno de ese nivel; pincha una para verla en grande.</p></div>'+
      '<div class="mwrap in" style="--d:2"><table class="mx"><thead><tr><th class="first">Criterio del centro</th>'+t.niveles.map(function(n){return '<th class="lv">'+esc(n.nom)+'<small style="display:block;font-family:IBM Plex Sans,sans-serif;font-size:12px;color:var(--mute);font-weight:500">'+esc(n.corr)+'</small></th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr><td class="first"><b>'+esc(r.c.cod)+'</b><small>Criterio oficial '+esc(r.o.num)+'</small><span>'+esc(r.c.txt)+'</span></td>'+r.c.ind.map(function(x){return '<td class="cell"><button type="button" data-go="ind" data-of="'+r.o.num+'" data-cc="'+r.c.cod+'">'+esc(x.txt)+'</button></td>';}).join('')+'</tr>'; }).join('')+
      '</tbody></table></div>'+
      '<div class="actions in" style="--d:4"><button type="button" class="btn" data-go="tramo">Cambiar de tramo</button><button type="button" class="btn" data-go="of">Recorrer paso a paso</button></div></section>';
  }
  var SCENES = {home:sceneHome, tramo:sceneTramo, of:sceneOf, cc:sceneCc, ind:sceneInd, matriz:sceneMatriz};
  var STEP = {home:0, tramo:1, of:2, cc:3, ind:4, matriz:4};

  // ---------- migas y barra
  function renderTop(){
    var s=state.scene; top.classList.toggle('show', s!=='home');
    var h=[]; var t=tramo();
    if(t){ h.push('<button type="button" class="crumb c-'+t.key+'" data-go="of"><i></i><span>'+esc(t.nombre)+' · '+esc(t.decreto)+'</span></button>'); }
    if(t && state.of && (s==='cc'||s==='ind')){ var o=ofObj(); h.push('<span class="thread"></span><button type="button" class="crumb c-of" data-go="cc" data-of="'+o.num+'"><i></i><span>Criterio oficial '+esc(o.num)+'</span></button>'); }
    if(t && state.cc && s==='ind'){ h.push('<span class="thread"></span><button type="button" class="crumb c-cc" data-go="ind" data-cc="'+esc(state.cc)+'"><i></i><span>'+esc(state.cc)+' · '+esc(ccObj().txt)+'</span></button>'); }
    if(s==='matriz' && t){ h.push('<span class="thread"></span><span class="crumb c-'+t.key+'"><i></i><span>Vista completa</span></span>'); }
    crumbsEl.innerHTML = h.join('');
    var st=STEP[s]; stepsEl.querySelectorAll('b').forEach(function(b,i){ b.classList.toggle('on', i<st); });
    stepsEl.querySelector('span').textContent = s==='matriz' ? 'Vista completa' : (st? 'Paso '+st+' de 4' : '');
    orb.style.setProperty('--s', String(1 + st*0.22));
  }
  function hash(){ var p=[]; if(state.tramo) p.push(state.tramo); if(state.scene==='matriz'){ p.push('todo'); } else { if(state.of && (state.scene==='cc'||state.scene==='ind')) p.push(state.of); if(state.cc && state.scene==='ind') p.push(state.cc); }
    var h = state.scene==='home' ? '' : (state.scene==='tramo' ? 'tramo' : p.join('/')); if(location.hash.slice(1)!==h) history.pushState(null,'','#'+h); }

  // ---------- transición
  var busy=false;
  function go(scene, opts){
    opts=opts||{}; if(busy) return; busy=true;
    if(opts.tramo) state.tramo=opts.tramo; if(opts.of) state.of=opts.of; if(opts.cc) state.cc=opts.cc;
    if(scene==='ind' && opts.cc && !opts.of){ var f=ccAny(opts.cc); if(f) state.of=f.of.num; }
    if(scene==='tramo'){ state.tramo=null; state.of=null; state.cc=null; }
    if(scene==='of'){ state.of=null; state.cc=null; }
    if(scene==='cc'){ state.cc=null; }
    var old = stage.querySelector('.scene');
    var ghost = null;
    if(opts.from && !RM){ var r=opts.from.getBoundingClientRect(); ghost=opts.from.cloneNode(true); ghost.className='ghost card '+opts.from.className.replace('in','').replace('card',''); ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px'; ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px'; ghost.style.margin='0'; document.body.appendChild(ghost); }
    state.scene=scene; hash(); renderTop();
    var next=document.createElement('div'); next.innerHTML=SCENES[scene](); var ns=next.firstElementChild;
    if(old){ old.classList.add('leaving'); if(!RM){ old.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-36px)'}],{duration:320,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}); } }
    stage.appendChild(ns); window.scrollTo({top:0,behavior:'instant'});
    if(!RM){ ns.animate([{opacity:0,transform:'translateX(40px)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.2,.7,.2,1)'}); }
    setTimeout(function(){ if(old) old.remove(); }, RM?0:340);
    var target = ns.querySelector('#pin') || (scene==='of'||scene==='tramo'||scene==='matriz' ? crumbsEl.lastElementChild : null);
    if(ghost && target){ requestAnimationFrame(function(){ var r2=target.getBoundingClientRect(); ghost.animate([{left:ghost.style.left,top:ghost.style.top,width:ghost.style.width,height:ghost.style.height,opacity:1},{left:r2.left+'px',top:r2.top+'px',width:r2.width+'px',height:r2.height+'px',opacity:.15}],{duration:520,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}).onfinish=function(){ ghost.remove(); }; }); }
    else if(ghost){ ghost.remove(); }
    if(scene==='cc'){ setTimeout(drawWire, RM?0:80); setTimeout(drawWire, 700); }
    var f=ns.querySelector('.card,.cta,.btn'); if(f && opts.focus!==false){ setTimeout(function(){ try{ f.focus({preventScroll:true}); }catch(e){} }, 450); }
    setTimeout(function(){ busy=false; }, RM?0:360);
  }
  function drawWire(){
    var br=stage.querySelector('.scene:not(.leaving) .branch'); if(!br) return; var svg=br.querySelector('svg.wire'), pin=stage.querySelector('.scene:not(.leaving) #pin'); if(!svg||!pin) return;
    var b=br.getBoundingClientRect(), p=pin.getBoundingClientRect(); var x0=p.left-b.left+64, y0=p.bottom-b.top;
    var paths=[]; br.querySelectorAll('.card.cc').forEach(function(k){ var r=k.getBoundingClientRect(); var x1=r.left-b.left, y1=r.top-b.top+r.height/2; var mx=(x0+x1)/2;
      paths.push('M'+x0+','+y0+' C'+x0+','+(y0+40)+' '+x0+','+y1+' '+Math.max(x0,x1-30)+','+y1+' L'+x1+','+y1); });
    svg.setAttribute('viewBox','0 0 '+b.width+' '+b.height); svg.innerHTML = paths.map(function(d){return '<path d="'+d+'"/>';}).join('');
    if(!RM){ svg.querySelectorAll('path').forEach(function(pt,i){ var L=pt.getTotalLength(); pt.style.strokeDasharray=L; pt.style.strokeDashoffset=L; pt.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:700,delay:200+i*250,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}); }); }
  }
  window.addEventListener('resize', function(){ if(state.scene==='cc') drawWire(); });

  // ---------- eventos
  document.addEventListener('click', function(ev){
    var b=ev.target.closest('[data-go]'); if(!b) return; ev.preventDefault();
    var scene=b.getAttribute('data-go'); var from = b.classList.contains('card') ? b : null;
    go(scene, {tramo:b.getAttribute('data-tramo')||undefined, of:b.getAttribute('data-of')||undefined, cc:b.getAttribute('data-cc')||undefined, from:from});
  });
  function back(){ var s=state.scene; var prev={tramo:'home', of:'tramo', cc:'of', ind:'cc', matriz:'of'}[s]; if(!prev) return; var keep={};
    if(prev==='cc'){ keep.of=state.of; } go(prev, keep); }
  document.getElementById('back').addEventListener('click', back);
  document.getElementById('logo').addEventListener('click', function(ev){ ev.preventDefault(); go('home'); });
  document.addEventListener('keydown', function(ev){ if(ev.target.tagName==='INPUT') return;
    if(ev.key==='ArrowLeft'||ev.key==='Backspace'){ ev.preventDefault(); back(); }
    if(ev.key==='ArrowRight'){ var f=stage.querySelector('.scene:not(.leaving) .cta, .scene:not(.leaving) .card[data-go], .scene:not(.leaving) .btn.primary'); if(f){ ev.preventDefault(); f.click(); } } });
  function fromHash(){ var h=location.hash.slice(1); state={scene:'home',tramo:null,of:null,cc:null}; if(!h) return;
    if(h==='tramo'){ state.scene='tramo'; return; } var p=h.split('/'); if(!T[p[0]]) return; state.tramo=p[0]; state.scene='of';
    if(p[1]==='todo'){ state.scene='matriz'; return; } if(p[1]){ var o=T[p[0]].criterios.filter(function(c){return c.num===p[1] && !c.no;})[0]; if(o){ state.of=o.num; state.scene='cc'; if(p[2]){ var c=o.centros.filter(function(x){return x.cod===p[2];})[0]; if(c){ state.cc=c.cod; state.scene='ind'; } } } } }
  window.addEventListener('popstate', function(){ fromHash(); renderTop(); stage.innerHTML=SCENES[state.scene](); if(state.scene==='cc') setTimeout(drawWire,80); });
  fromHash(); renderTop(); stage.innerHTML=SCENES[state.scene](); if(state.scene==='cc') setTimeout(drawWire,120);
})();
</script>

</body>
</html>
